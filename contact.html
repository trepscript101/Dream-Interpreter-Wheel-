<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Decode Tonight's Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0d1a; --void-2:#11162a; --panel:#151b32; --line: rgba(255,255,255,0.08);
    --violet:#8b7bf7; --teal:#3ee8c9; --text:#eceefc; --text-dim:#9098bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter', sans-serif;
    background: radial-gradient(circle at 20% 10%, rgba(139,123,247,0.12), transparent 40%), var(--void);
    color:var(--text); min-height:100vh; padding:32px 20px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  a{ color:var(--teal); }
  h1{
    font-family:'Space Grotesk', sans-serif; font-size:30px; margin:0 0 24px;
    background:linear-gradient(120deg,#fff, var(--violet) 70%); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p{ font-size:14.5px; line-height:1.7; color:#c7cae6; }
  .email-box{
    display:inline-block; margin-top:10px; padding:14px 20px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); font-size:15px; color:var(--teal);
    text-decoration:none; font-family:'Space Grotesk', sans-serif; font-weight:600;
  }
  .back{ display:block; margin-top:36px; font-size:13px; color:var(--text-dim); text-decoration:none; border-top:1px solid var(--line); padding-top:16px; }
  .back a{ color:var(--teal); }
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SHZLFX62ES"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SHZLFX62ES');
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7170565918227194" crossorigin="anonymous"></script>
</head>

<body>
<div class="wrap">
  <h1>Contact</h1>
  <p>Questions, feedback, or something not working right? Reach out directly:</p>
  <a class="email-box" href="mailto:hello@dreaminterpreterwheel.com">hello@dreaminterpreterwheel.com</a>
  <p style="margin-top:24px;">We read every message and try to respond within a few days.</p>
  <div class="back"><a href="/">← Back to the wheel</a></div>
</div>
</body>
    </html>
